# Migrazioni dello schema.
#
# La connessione non è scritta qui: arriva a runtime da `app.migrations`, che
# passa ad Alembic l'engine già configurato (condiviso o locale). Così le
# credenziali restano nel `config.json` della postazione.
#
# Da riga di comando si crea una revisione:
#
#   .venv\Scripts\python.exe -m alembic revision -m "descrizione"
#
# Le migrazioni **non** si applicano da qui (`alembic upgrade` non ha una
# connessione e si ferma): le applica il backend all'avvio, su entrambi i
# database. Per forzarle a mano:
#
#   .venv\Scripts\python.exe -c "from app.db import init_db; init_db()"

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = Europe/Rome

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
